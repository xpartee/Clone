<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transfer Your Data</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .app-container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Top Navigation Icons */
    .header-actions {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 18px;
      margin-bottom: 40px;
      padding-right: 4px;
    }

    .header-icon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: #ffffff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      cursor: pointer;
      opacity: 0.9;
    }

    /* Main Title */
    h1 {
      font-size: 28px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 40px;
      letter-spacing: -0.5px;
    }

    /* Options Stack */
    .options-grid {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .option-card {
      background-color: #232328;
      border-radius: 28px;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-decoration: none;
      color: #ffffff;
      transition: background-color 0.2s ease, transform 0.1s ease;
      cursor: pointer;
    }

    .option-card:hover {
      background-color: #2c2c32;
    }

    .option-card:active {
      transform: scale(0.98);
    }

    /* Blue Icon Badge */
    .icon-badge {
      width: 46px;
      height: 46px;
      background-color: #558ee6;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-badge svg {
      width: 24px;
      height: 24px;
      fill: #ffffff;
    }

    .card-label {
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Top Action Bar -->
    <div class="header-actions">
      <!-- Cloud Icon -->
      <svg class="header-icon" viewBox="0 0 24 24"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></svg>
      <!-- Memory Card Icon -->
      <svg class="header-icon" viewBox="0 0 24 24"><path d="M6 2h9l5 5v13a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/><path d="M10 2v4"/><path d="M14 2v4"/></svg>
      <!-- Menu Dots Icon -->
      <svg class="header-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1.5" fill="#ffffff"/><circle cx="12" cy="5" r="1.5" fill="#ffffff"/><circle cx="12" cy="19" r="1.5" fill="#ffffff"/></svg>
    </div>

    <!-- Page Title -->
    <h1>Transfer your data</h1>

    <!-- Transfer Cards -->
    <div class="options-grid">
      <a href="#" class="option-card">
        <div class="icon-badge">
          <!-- Send Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM5 5h6V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h6v-2H5V5z"/>
          </svg>
        </div>
        <span class="card-label">Send from this phone</span>
      </a>

      <a href="#" class="option-card">
        <div class="icon-badge">
          <!-- Receive Icon -->
          <svg viewBox="0 0 24 24">
            <path d="M19 5h-6V3h6c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2h-6v-2h6V5zm-7 12l1.41-1.41L10.83 13H21v-2H10.83l2.58-2.58L12 7l-5 5 5 5z"/>
          </svg>
        </div>
        <span class="card-label">Receive on this phone</span>
      </a>
    </div>
  </div>

</body>
</html>
